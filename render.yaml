# Render Blueprint – GÓI MIỄN PHÍ.
# Database + file XML/PDF lưu trên Neon (PostgreSQL miễn phí, bền vững). Website chạy trên Render Free.
# Khi triển khai, Render sẽ hỏi 2 giá trị: DATABASE_URL (chuỗi kết nối Neon) và SEED_ADMIN_PASSWORD.
services:
  - type: web
    name: fdi-invoice-pro
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_EMAIL
        value: admin@fdi.local
      - key: STORAGE_DRIVER
        value: db
      - key: JOB_MODE
        value: inline
      - key: COOKIE_SECURE
        value: "true"
