# Chạy toàn bộ hệ thống: docker compose up -d   → http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fdi
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/fdi
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/storage-data
      JOB_MODE: worker
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@fdi.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@12345}
    volumes: [files:/app/storage-data]
  worker:
    build: .
    depends_on: [app]
    command: ["npm", "run", "worker"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/fdi
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/storage-data
    volumes: [files:/app/storage-data]
volumes:
  pgdata:
  files:
